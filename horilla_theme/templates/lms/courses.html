{% extends "index.html" %}
{% load static i18n %}

{% block content %}
    <link rel="stylesheet" href="{% static 'css/modern-dashboard.css' %}">
    <div class="md-dashboard">
        <div class="md-header">
            <div>
                <h1>{% trans "Manage courses" %}</h1>
                <div class="md-header__description">
                    {% trans "Create courses, publish them to the catalog, and build chapters." %}
                </div>
            </div>
        </div>

        <div class="oh-inner-sidebar-content border border-[#E2E8F0] rounded-xl bg-white p-2 mb-4">
            <div hx-get="{% url 'lms-course-nav' %}" hx-trigger="load"></div>
            <div class="oh-wrapper" id="lmsCourseListContainer"></div>
        </div>
    </div>
    <script src="{% static 'cbv/deleteFunc.js' %}"></script>
{% endblock %}
