{% load i18n %}
{# Theme override: Vristo-styled global shells (HTMX targets unchanged). #}

<div
    class="oh-modal vr-modal"
    id="allocationModal"
    role="dialog"
    aria-labelledby="allocationModal"
>
    <div class="oh-modal__dialog oh-modal__dialog-process max-w-[900px]">
        <div class="oh-modal__dialog-header vr-modal__header">
            <span class="vr-modal__title" id="addEmployeeModalLabel">{% trans "Allocation" %}</span>
            <button
                class="oh-modal__close vr-modal__close"
                aria-label="{% trans 'Close' %}"
                onclick="$(this).closest('.oh-modal--show').removeClass('oh-modal--show')"
            >
                <ion-icon name="close-outline"></ion-icon>
            </button>
        </div>

        <div class="oh-modal__dialog-body" id="allocationModalBody"></div>
    </div>
</div>

<div
    style="z-index: 1022"
    class="oh-modal vr-modal"
    id="deleteConfirmation"
    role="dialog"
    aria-labelledby="deleteConfirmation"
    aria-hidden="true"
>
    <div
        class="oh-modal__dialog oh-modal__dialog--custom max-w-[900px]"
        id="deleteConfirmationBody"
    >
    </div>
</div>

<div
    class="oh-modal vr-modal"
    id="genericModal"
    role="dialog"
    aria-labelledby="genericModal"
    aria-hidden="true"
>
    <div class="oh-modal__dialog" id="genericModalBody"></div>
</div>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        var reopenUrl = null;
        try {
            reopenUrl = sessionStorage.getItem("reopenDetailModal");
            if (reopenUrl) {
                sessionStorage.removeItem("reopenDetailModal");
            }
        } catch (e) {}
        if (!reopenUrl || !window.htmx) {
            return;
        }
        htmx.ajax("GET", reopenUrl, {
            target: "#genericModalBody",
            swap: "innerHTML",
        });
        var modal = document.getElementById("genericModal");
        if (modal) {
            modal.classList.add("oh-modal--show");
        }
    });
</script>

<div
    style="z-index: 1022"
    class="oh-modal vr-modal"
    id="relatedObjectModal"
    role="dialog"
    aria-labelledby="relatedObjectModal"
    aria-hidden="true"
>
    <div class="oh-modal__dialog" id="relatedObjectModalBody"></div>
</div>
<script>
    document.addEventListener(
        "click",
        function (event) {
            var closeBtn = event.target.closest(
                "#relatedObjectModal .oh-modal__close, #relatedObjectModal .oh-modal__cancel"
            );
            if (closeBtn) {
                event.stopImmediatePropagation();
                document.getElementById("relatedObjectModal").classList.remove("oh-modal--show");
            }
        },
        true
    );
</script>

<style>
    .oh-related-link:hover {
        text-decoration: underline;
    }
</style>

<div class="oh-activity-sidebar vr-drawer" id="genericSidebar" style="z-index: 1000">
    <div class="oh-activity-sidebar__body" id="genericOffCanvas"></div>
</div>

<div class="oh-modal vr-modal" id="objectDetailW75Modal" role="dialog" aria-labelledby="allocationModal">
    <div class="oh-modal__dialog oh-modal__dialog-process max-w-[900px]">
        <div class="oh-modal__dialog-header vr-modal__header">
            <button
                class="oh-modal__close vr-modal__close"
                aria-label="{% trans 'Close' %}"
                onclick="$(this).closest('.oh-modal--show').removeClass('oh-modal--show')"
            >
                <ion-icon name="close-outline" role="img" class="md hydrated"></ion-icon>
            </button>
        </div>

        <div class="oh-modal__dialog-body" id="objectDetailW75ModalTarget"></div>
    </div>
</div>

<div class="oh-activity-sidebar vr-drawer pb-5" id="historySidebar" style="z-index: 1000;">
    <div class="oh-activity-sidebar__body h-full" id="historyContainer"></div>
</div>

<script>
    $(document).on("htmx:afterOnLoad", function (event) {
    	$("[data-toggle='oh-modal-toggle']").click(function (e) {
    		e.preventDefault();
    		let clickedEl = $(e.target).closest(
    			'[data-toggle = "oh-modal-toggle"]'
    		);
    		if (clickedEl != null) {
    			const targetEl = clickedEl.data("target");
    			$(targetEl).addClass("oh-modal--show");
    		}
    	});
    });
</script>
{% block generic_components %}
{% endblock generic_components %}
