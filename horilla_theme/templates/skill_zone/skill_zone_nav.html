{% load static i18n %}
<div class="w-full mb-4">
    <div class="flex flex-col gap-3 lg:flex-row lg:items-center lg:justify-between">
        <h1 class="text-lg font-semibold text-[#0F172A] m-0">
            {% trans "Talent Pool" %}
        </h1>

        <div class="flex flex-wrap items-center gap-2 w-full lg:w-auto lg:justify-end">
            <form
                hx-get="{% url 'skill-zone-filter' %}"
                id="filterForm"
                hx-target="#skill_zone_container"
                class="flex flex-wrap items-center gap-2 flex-1 lg:flex-initial min-w-0"
                onsubmit="event.preventDefault()"
            >
                <div class="oh-input-group oh-input__search-group relative flex-1 min-w-[200px] max-w-md">
                    <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 opacity-50 text-xs pointer-events-none"></i>
                    <input
                        type="text"
                        class="text-color-600 ps-8 p-2 w-full border border-[#CBD5E1] rounded-lg focus-visible:outline-0 text-sm focus:border-primary-600"
                        aria-label="{% trans 'Search Input' %}"
                        placeholder="{% trans 'Search' %}"
                        name="search"
                        hx-get="{% url 'skill-zone-filter' %}"
                        onkeyup="$('#applyFilter').click()"
                    >
                </div>

                <button
                    type="button"
                    id="modernFilterTrigger"
                    onclick="toggleModernFilterPanel(true)"
                    class="px-4 py-2 h-[40px] bg-white rounded-lg text-xs flex items-center gap-2 border border-[#CBD5E1] hover:border-primary-600 transition duration-300 cursor-pointer shrink-0"
                >
                    <img src="{% static 'horilla_theme/assets/img/icons/sort.svg' %}" alt="{% trans 'Filter' %}" width="15">
                    {% trans "Filter" %}
                </button>
            </form>

            <a
                class="oh-btn oh-btn--secondary oh-btn--shadow shrink-0"
                data-toggle="oh-modal-toggle"
                data-target="#objectCreateModal"
                hx-get="{% url 'skill-zone-create' %}"
                hx-target="#objectCreateModalTarget"
            >
                <ion-icon name="add-outline" class="me-1"></ion-icon>
                {% trans "Create" %}
            </a>
        </div>
    </div>
</div>
{% include "generic/filter_tags.html" %}
