{% load i18n static %}
{% comment %}
  Dashboard (top-level icon, no submenu panel). We attach the same
  htmx boost params used by submenu links so clicking Dashboard swaps
  only the main content region instead of doing a full page reload.
{% endcomment %}
<a
    href="{% url home_dashboard_url_name %}"
    class="sideboxmain w-full"
    data-menu="Dashboard"
    hx-get="{% url home_dashboard_url_name %}"
    hx-target="#ohMainContent"
    hx-select="#ohMainContent > *"
    hx-swap="innerHTML show:window:top"
    hx-push-url="true"
>
    <img
        src="{% static 'images/ui/dashboard.svg' %}"
        alt=""
        class="flex-shrink-0"
        aria-hidden="true"
    >
    <span
        class="oh-sidebar-label text-sm font-medium truncate flex-1 text-left"
        aria-hidden="true"
    >{% trans "Dashboard" %}</span>
</a>
