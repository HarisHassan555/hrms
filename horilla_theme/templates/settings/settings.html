{% load i18n %}
<style>
    .prefix input {
        margin-bottom: 0px;
    }
    .oh-info {
        top: 0px !important;
    }
</style>
<div class="col-span-12" id="setting-badge-id-prefix">
    <form
        id="formatting-prefix-form"
        action="{% url 'initial-prefix' %}"
        method="post"
        onsubmit="event.preventDefault(); var btn = document.getElementById('formatting-localization-save'); if (btn) { saveFormattingLocalizationAll(btn); } return false;"
    >
        {% csrf_token %}

        <div class="flex space-x-2 pb-1">
            <label> {% trans "Prefix" %}</label>
            <span class="oh-info" title="{% trans 'Set initial badge-id' %}"> </span>
        </div>
        <p class="text-xs text-gray-500 mt-1 pb-2">
            {% trans "Prefix added to every auto-generated employee badge ID (e.g. PEP0001)." %}
        </p>
        <div class="prefix">
            {{ prefix_form.badge_id_prefix }}
            {% if prefix_form.badge_id_prefix.errors %}
                <div class="text-danger">
                    {{ prefix_form.badge_id_prefix.errors|join:", " }}
                </div>
            {% endif %}
        </div>
    </form>
</div>
