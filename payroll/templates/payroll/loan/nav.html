{% load i18n %}
<section
    class="oh-wrapper oh-main__topbar"
    style="padding-bottom: 1rem; padding-top: 40px"
>
    <div class="oh-main__titlebar oh-main__titlebar--left oh-d-flex-column--resp oh-mb-3--small">
        <h1 class="oh-main__titlebar-title fw-bold">
            {% trans 'Loans & Salary Advances' %}
        </h1>
    </div>

    <form
        hx-get="{% url 'search-loan' %}"
        hx-target="#loanContainer"
        onsubmit="event.stopPropagation()"
    >
        <div class="oh-main__titlebar oh-main__titlebar--right oh-d-flex-column--resp oh-mb-3--small">
            {% if records %}
                <div class="oh-input-group oh-input__search-group mr-4">
                    <ion-icon
                        name="search-outline"
                        class="oh-input-group__icon oh-input-group__icon--left md hydrated"
                        role="img"
                        aria-label="{% trans 'search outline' %}"
                    ></ion-icon>
                    <input
                        type="text"
                        id="pipelineSearch"
                        placeholder="{% trans 'Search' %}"
                        style="margin-right: 10px"
                        onkeyup="$('.filterButton').click()"
                        name="search"
                        class="oh-input oh-input__icon mr-3"
                        aria-label="{% trans 'Search Input' %}"
                    >
                </div>
                <input
                    type="hidden"
                    name="view"
                    value="{{request.GET.view}}"
                    id="loanViewType"
                >
                <ul class="oh-view-types ml-2" style="margin-bottom: 0">
                    <li class="oh-view-type employee-view-type" data-view="list">
                        <a
                            id="list"
                            onclick="$('#loanViewType').val('list');setTimeout(() => {
                            $('.filterButton')[0].click();
                            }, 10);$('.oh-btn--view-active').removeClass('oh-btn--view-active'); $(this).addClass('oh-btn--view-active')"
                            class="oh-btn oh-btn--view {% if request.GET.view == 'list' %} oh-btn--view-active {% endif %}"
                            title='{% trans "List" %}'
                        ><ion-icon name="list-outline"></ion-icon></a>
                    </li>
                    <li class="oh-view-type employee-view-type" data-view="card">
                        <a
                            id="card"
                            onclick="$('#loanViewType').val('card');setTimeout(() => {
                            $('.filterButton')[0].click();
                            }, 10);$('.oh-btn--view-active').removeClass('oh-btn--view-active'); $(this).addClass('oh-btn--view-active')"
                            class="oh-btn oh-btn--view {% if request.GET.view != 'list' %} oh-btn--view-active {% endif %}"
                            title='{% trans "Card" %}'
                        ><ion-icon name="grid-outline"></ion-icon></a>
                    </li>
                </ul>
                {% include 'payroll/loan/filter.html' %}
            {% endif %}
            {% if perms.payroll.add_loanaccount %}
                <div class="oh-main__titlebar-button-container">
                    <div class="oh-main__titlebar-button-container">
                        <a
                            hx-get="{% url 'create-loan' %}"
                            hx-target="#objectCreateModalTarget"
                            data-toggle="oh-modal-toggle"
                            data-target="#objectCreateModal"
                            class="oh-btn oh-btn--secondary"
                        >
                            <ion-icon name="add-outline"></ion-icon>
                            {% trans 'Create' %}
                        </a>
                    </div>
                </div>
            {% endif %}
        </div>
    </form>
</section>

<script>
    $(document).ready(function () {
        $("#objectCreateModalTarget").on("htmx:afterSwap", function () {
            var MAX_INSTALLMENTS = 360;

            $("[name='installment_amount']").on("change", function () {
                var loanAmount = parseFloat($("[name='loan_amount']").val());
                var installmentAmount = parseFloat($(this).val());

                if (!loanAmount || !installmentAmount || installmentAmount <= 0) {
                    return;
                }

                var installments = Math.round(loanAmount / installmentAmount);
                if (installments < 1) {
                    installments = 1;
                }
                if (installments > MAX_INSTALLMENTS) {
                    installments = MAX_INSTALLMENTS;
                    $(this).val((loanAmount / installments).toFixed(2));
                }
                $("[name='installments']").val(installments);
            });

            $("[name='installments']").on("change keyup", function () {
                var loanAmount = parseFloat($("[name='loan_amount']").val());
                var installments = parseInt($(this).val(), 10);

                if (!loanAmount || !installments || installments <= 0) {
                    return;
                }
                if (installments > MAX_INSTALLMENTS) {
                    installments = MAX_INSTALLMENTS;
                    $(this).val(installments);
                }

                $("[name='installment_amount']").val(
                    (loanAmount / installments).toFixed(2)
                );
            });
        });
    });
</script>
