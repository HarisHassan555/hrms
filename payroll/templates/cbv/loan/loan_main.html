{% extends "index.html" %}
{% load static %}
{% load i18n %}

{% block content %}
    <meta name="csrf-token" content="{{ csrf_token }}">

    {% include "generic/components.html" %}
    <div class="oh-checkpoint-badge mb-2" id="selectedInstances" data-ids="[]" data-clicked="" style="display: none">
    </div>
    <div
        class="oh-wrapper"
        id="listContainer"
        hx-get="{% url 'loan-generic-tab-view' %}?{{ request.GET.urlencode }}"
        hx-trigger="load"
    >
        <div class="animated-background"></div>
    </div>

    <div class="oh-modal" id="loanModal" role="dialog" aria-hidden="true">
        <div class="oh-modal__dialog" style="max-width: 550px">
            <div class="oh-modal__dialog-header">
                <button type="button" class="oh-modal__close" aria-label="{% trans 'Close' %}">
                    <ion-icon name="close-outline"></ion-icon>
                </button>
            </div>

            <div class="oh-modal__dialog-body" id="loanModalBody"></div>
        </div>
    </div>

    <script>
        $(document).ready(function () {
            $("#genericModalBody").on("htmx:afterSwap", function () {
                var MAX_INSTALLMENTS = 360;

                $("[name='installment_amount']").on("change", function () {
                    var loanAmount = parseFloat($("#id_loan_amount").val());
                    var installmentAmount = parseFloat($(this).val());

                    if (!loanAmount || !installmentAmount || installmentAmount <= 0) {
                        return;
                    }

                    var installments = Math.round(loanAmount / installmentAmount);
                    if (installments < 1) {
                        installments = 1;
                    }
                    if (installments > MAX_INSTALLMENTS) {
                        installments = MAX_INSTALLMENTS;
                        var cappedAmount = (loanAmount / installments).toFixed(2);
                        $(this).val(cappedAmount);
                    }
                    $("[name='installments']").val(installments);
                });

                $("[name='installments']").on("change keyup", function () {
                    var loanAmount = parseFloat($("[name='loan_amount']").val());
                    var installments = parseInt($(this).val(), 10);

                    if (!loanAmount || !installments || installments <= 0) {
                        return;
                    }
                    if (installments > MAX_INSTALLMENTS) {
                        installments = MAX_INSTALLMENTS;
                        $(this).val(installments);
                    }

                    var installmentAmount = (loanAmount / installments).toFixed(2);
                    $("[name='installment_amount']").val(installmentAmount);
                });
            });
        });

        document.body.addEventListener("reloadPayrollLoanTabs", function () {
            var applyFilterButton = document.getElementById("applyFilter");
            if (applyFilterButton) {
                applyFilterButton.click();
            } else if (window.htmx) {
                htmx.ajax("GET", "{% url 'loan-generic-tab-view' %}" + (window.location.search || ""), {
                    target: "#listContainer",
                    swap: "innerHTML",
                });
            }
            var msgButton = document.getElementById("reloadMessagesButton");
            if (msgButton) {
                msgButton.click();
            }
        });
    </script>
    <script src="{% static 'cbv/deleteFunc.js' %}"></script>
{% endblock content %}
